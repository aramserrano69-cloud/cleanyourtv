name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        working-directory: launcher
        run: gradle assembleDebug --no-daemon -PlauncherApplicationId=com.gathin.tvhome.fondo
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-video-apk
          path: launcher/app/build/outputs/apk/debug/*.apk
